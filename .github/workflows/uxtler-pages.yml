name: UXTLER static benchmark

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uxtler-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # A directory this job owns exclusively, separate from web/backend/data
      # (local dev's working data) — event_bench/game_sites write their
      # archives here instead, so this job's own commit below can never
      # overwrite a developer's locally-accumulated archive on a later pull.
      BENCHMARK_DATA_DIR: ${{ github.workspace }}/web/backend/data/ci
      DATABASE_URL: sqlite:///${{ github.workspace }}/web/backend/data/ci/static_state.db
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STATIC_CLASSIFY_LIMIT: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r web/backend/requirements.txt

      - name: Refresh benchmark data when API credentials are configured
        if: ${{ env.OPENAI_API_KEY != '' || env.ANTHROPIC_API_KEY != '' }}
        run: python web/backend/static_refresh.py

      - name: Persist isolated collector state
        if: ${{ env.OPENAI_API_KEY != '' || env.ANTHROPIC_API_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web/backend/data/ci
          git add web/frontend/public/data
          git diff --cached --quiet || git commit -m "chore: refresh UXTLER benchmark data [skip ci]"
          git push

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Build static site
        working-directory: web/frontend
        env:
          VITE_STATIC_SITE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/frontend/dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
