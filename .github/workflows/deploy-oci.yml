name: Deploy to OCI

# master에 push되면:
#   1) 이 러너에서 프런트엔드를 빌드하고(서버가 RAM 1GB짜리 Always Free
#      x86 인스턴스라 서버에서 직접 빌드하지 않는다)
#   2) 백엔드 소스 + 빌드된 dist/를 rsync로 서버에 통째로 올린 뒤
#   3) SSH로 deploy.sh(venv/의존성 갱신 + systemd 재시작)만 원격 실행한다
#
# 서버 최초 세팅(web/backend/deploy/setup_server.sh)은 이 워크플로 범위
# 밖 — 한 번은 수동으로 거쳐야 한다.
#
# 필요한 리포지토리 시크릿(Settings → Secrets and variables → Actions):
#   OCI_HOST        인스턴스 공인 IP
#   OCI_SSH_KEY     배포 전용 SSH 개인키 전체 내용
#   OCI_USER        SSH 접속 계정 (Ubuntu 이미지는 보통 "ubuntu")

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Sync files to server
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # web/backend/data/ 전체를 빼면 서버 로컬 상태(SQLite DB 등)는
          #지켜지지만, 그 안에 git으로 커밋해둔 정적 벤치마크 데이터
          # (data/ci/ 등 — event_bench/game_sites 메뉴가 예전엔 읽던 데이터)
          # 까지 같이 빠져서 두 메뉴가 빈 화면이 됐다. 서버가 직접 만드는
          # 하위 폴더/파일만 정확히 제외한다.
          #
          # data/live/는 event_bench/game_sites의 실제 운영 데이터 경로
          # (BENCHMARK_DATA_DIR)다 — 서버 자체 스케줄러가 매시간 직접
          # 채워넣는 곳이라, 이걸 빼지 않으면 --delete가 켜진 이 rsync가
          # 매 배포마다 그 자리를 git의 옛 상태(또는 존재하지 않음)로
          # 지워버려서 방금 수집한 이벤트가 배포 직후 사라지는 문제가
          # 실제로 있었다.
          switches: >-
            -avz --delete
            --exclude=.git/
            --exclude=.env
            --exclude=web/backend/.venv/
            --exclude=web/backend/data/*.db
            --exclude=web/backend/data/uploads/
            --exclude=web/backend/data/outputs/
            --exclude=web/backend/data/images/
            --exclude=web/backend/data/live/
            --exclude=web/frontend/node_modules/
          path: ./
          remote_path: /opt/uxui/plan_gen/
          remote_host: ${{ secrets.OCI_HOST }}
          remote_user: ${{ secrets.OCI_USER }}
          remote_key: ${{ secrets.OCI_SSH_KEY }}

      - name: Install deps & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: bash /opt/uxui/plan_gen/web/backend/deploy/deploy.sh
