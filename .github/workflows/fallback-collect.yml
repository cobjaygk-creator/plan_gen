name: Fallback event collection (blocked-IP sources)

# tales.nexon.com(테일즈위버)/tr.rhaon.co.kr(테일즈런너)/gersang.co.kr(거상)/
# thefinals.nexon.com(더 파이널스)는 오라클 클라우드 IP를 차단해서 운영
# 서버가 직접 수집할 수 없다(같은 코드가
# GitHub Actions·집/사무실 IP에서는 정상 동작하는 것 확인). 이 워크플로가
# GitHub Actions의 망으로 대신 수집해서 커밋해두면, 운영 서버가 이 파일을
# raw.githubusercontent.com에서 매시간 직접 읽어간다 — GitHub Pages/정적
# 사이트와는 무관하고, git/rsync를 거치지 않는 순수 HTTP 읽기라 예전에
# data/ci를 배포가 덮어쓰던 것과 같은 충돌이 생기지 않는다.

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fallback-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r web/backend/requirements.txt

      - name: Collect blocked-IP sources
        working-directory: web/backend
        run: python fallback_collect.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/backend/data/github-collected/fallback_events.json
          git diff --cached --quiet || git commit -m "chore: refresh fallback event data (blocked-IP sources) [skip ci]"
          git push
