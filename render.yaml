services:
  - type: web
    name: plan-gen
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r requirements.txt -r web/backend/requirements.txt &&
      npm install --prefix web/frontend &&
      npm run build --prefix web/frontend
    startCommand: python -m uvicorn app.main:app --app-dir web/backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: plan-gen-data
      mountPath: /opt/render/project/src/web/backend/data
      sizeGB: 1
